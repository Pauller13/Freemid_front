<div class="row">
  <div class="col-sm-12">
    <!-- Carte pour la Gestion du Compte Freelance -->
    <app-card cardTitle="Gestion du Compte Freelance" [options]="false">
      <h5>Détails Personnels</h5>
      <hr />
      <form (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="photo">Photo de Profil</label>
              <input
                type="file"
                class="form-control"
                id="photo"
                accept="image/*"
                (change)="onFileSelected($event)"
              />
            </div>
            <div class="form-group">
              <label for="firstName">Prénom</label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                [(ngModel)]="freelance.user.first_name"
                name="first_name"
                placeholder="Entrez votre prénom"
                required
              />
            </div>
            <div class="form-group">
              <label for="lastName">Nom</label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                [(ngModel)]="freelance.user.last_name"
                name="last_name"
                placeholder="Entrez votre nom"
                required
              />
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label for="email">Adresse e-mail</label>
              <input
                type="email"
                class="form-control"
                id="email"
                [(ngModel)]="freelance.user.email"
                name="email"
                placeholder="Entrez votre email"
                required
              />
            </div>
            <div class="form-group">
              <label for="username">Nom d'utilisateur</label>
              <input
                type="text"
                class="form-control"
                id="username"
                [(ngModel)]="freelance.user.username"
                name="username"
                placeholder="Entrez votre nom d'utilisateur"
                required
              />
            </div>
            <div class="form-group">
              <label for="companyDescription">Description de la société</label>
              <textarea
                class="form-control"
                id="companyDescription"
                [(ngModel)]="freelance.company_description"
                name="company_description"
                rows="3"
                placeholder="Décrivez votre société"
              ></textarea>
            </div>
          </div>
        </div>
        <div class="form-group form-check">
          <input type="checkbox" class="form-check-input" id="terms" required />
          <label class="form-check-label" for="terms">J'accepte les conditions générales</label>
        </div>
        <button type="submit" class="btn btn-primary">Mettre à jour</button>
      </form>
    </app-card>

    <!-- Nouvelle Carte pour la Gestion du Mot de Passe -->
    <app-card cardTitle="Gestion du Mot de Passe" [options]="false" class="mt-4">
      <h5>Changer le Mot de Passe</h5>
      <form (ngSubmit)="changePassword()">
        <div class="form-group">
          <label for="currentPassword">Mot de Passe Actuel</label>
          <input
            type="password"
            class="form-control"
            id="currentPassword"
            [(ngModel)]="currentPassword"
            name="currentPassword"
            required
          />
        </div>
        <div class="form-group">
          <label for="newPassword">Nouveau Mot de Passe</label>
          <input
            type="password"
            class="form-control"
            id="newPassword"
            [(ngModel)]="newPassword"
            name="newPassword"
            required
          />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmer le Nouveau Mot de Passe</label>
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Changer le Mot de Passe</button>
        <div *ngIf="passwordChangeError" class="text-danger">{{ passwordChangeError }}</div>
      </form>
    </app-card>
  </div>
</div>
